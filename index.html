function render(){let found=all.filter(x=>(chosen==='همه'||x.group===chosen)&&(!query||x.t.includes(query)||String(x.n).includes(query)));list.innerHTML='';found.slice(0,limit).forEach(x=>{let d=document.createElement('article');d.className='reason';let num=document.createElement('span');num.className='num';num.textContent=x.n;let t=document.createElement('span');t.textContent=x.t;d.append(num,t);d.onclick=()=>{d.classList.toggle('done');num.textContent=d.classList.contains('done')?'♥':x.n};list.appendChild(d)});document.getElementById('count').textContent=found.length.toLocaleString('fa-IR');document.querySelector('.progress span').style.width=(found.length/221*100)+'%';document.getElementById('more').style.display=found.length>limit?'block':'none';if(!found.length)list.innerHTML='<div class="empty">چیزی پیدا نشد 🐰</div>'}
search.oninput=()=>{query=search.value.trim();limit=221;render()};document.getElementById('more').onclick=()=>{limit+=30;render()};document.getElementById('random').onclick=()=>{chosen='همه';query='';search.value='';limit=221;filters.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.textContent==='همه'));render();let x=all[Math.floor(Math.random()*all.length)];let el=[...list.children].find(d=>d.querySelector('.num')?.textContent==x.n);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.border='2px solid #d66e9e'}};
render();
</script></body></html>
